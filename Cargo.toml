[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EPL-2.0 OR GPL-2.0-or-later"

# Memory: sumo_core is one very large crate; full debug info roughly doubles the RAM a build needs.
# Line tables keep file:line in backtraces, which is all the oracle loop uses.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = 1
